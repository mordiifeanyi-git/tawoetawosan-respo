<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/faviconlogo.png">
    <title>Legal Insight | TAWO E. TAWO, SAN & CO.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --primary-royal: #172554; --primary-royal-dark: #0F172A; --bg-offwhite: #F8FAFC; --text-slate: #334155; }
        body { font-family: 'Roboto', 'Raleway', Arial, Helvetica, sans-serif; background-color: var(--bg-offwhite); color: var(--text-slate); line-height: 1.8; overflow-x: hidden; }
        h1, h2, h3, h4, h5, h6 { font-family: 'Raleway', 'Roboto', Arial, Helvetica, sans-serif; color: #0F172A; }
        
        .glass-card-light {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
        .glass-nav {
            background: rgba(23, 37, 84, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        /* Styling for References / Footnotes */
        .article-footnote-list {
            border-top: 2px solid #e2e8f0;
            margin-top: 2.5rem;
            padding-top: 1.5rem;
        }
        .article-footnote-list h4 {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #0F172A;
            margin-bottom: 0.75rem;
            font-family: 'Raleway', sans-serif;
            font-weight: 800;
        }
        .article-footnote-list ol {
            font-size: 12px;
            color: #475569;
            padding-left: 1.5rem;
        }
        .article-footnote-list li {
            margin-bottom: 0.5rem;
            line-height: 1.6;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="antialiased bg-[#F8FAFC] min-h-screen flex flex-col relative">

    <div class="fixed top-1/3 left-1/2 -translate-x-1/2 w-[500px] h-[500px] bg-blue-100/40 rounded-full blur-[120px] pointer-events-none z-0"></div>

    <header class="glass-nav sticky top-0 z-50 py-3 px-6 md:px-12 text-white shadow-md">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="index.html" class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-full overflow-hidden bg-white p-0.5 border border-white/40">
                    <img src="/WhatsApp Image 2026-10-08 at 13.10.32.jpeg" alt="Logo" class="w-full h-full object-cover rounded-full" onerror="this.src='https://placehold.co/100x100/172554/FFFFFF?text=TT';">
                </div>
                <span class="font-bold text-xs md:text-sm tracking-wide font-['Raleway']">TAWO E. TAWO, SAN & CO.</span>
            </a>
            <a href="articles.html" class="text-xs font-bold bg-white/10 hover:bg-white/20 border border-white/20 px-4 py-2 rounded-xl transition-all shadow-sm">
                &larr; Back to Insights &amp; Articles
            </a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 py-12 space-y-6 flex-1 w-full relative z-10">
        
        <div class="space-y-3 border-b border-gray-200 pb-6">
            <div>
                <span id="article-date" class="px-3 py-1 rounded-full bg-blue-50 text-[#172554] border border-blue-100 shadow-xs text-xs font-bold uppercase tracking-wider inline-block">Loading...</span>
            </div>
            <h1 id="article-title" class="text-2xl sm:text-4xl font-extrabold text-[#0F172A] font-['Raleway'] leading-tight">
                Loading Article...
            </h1>
        </div>

        <div id="article-media-container" class="rounded-2xl overflow-hidden border border-gray-200 bg-slate-950 shadow-md hidden aspect-video flex items-center justify-center"></div>

        <!-- SINGLE GLASS CARD FOR TEXT & PROMINENT AUTHOR FOOTER -->
        <div class="glass-card-light rounded-3xl shadow-xl border border-gray-200/80 overflow-hidden flex flex-col">
            
            <!-- Article Body Text -->
            <div id="article-body" class="p-8 sm:p-12 space-y-6 text-slate-700 text-sm sm:text-base leading-relaxed break-words [word-break:break-word] w-full">
                <p class="text-gray-400 text-center py-12">Retrieving publication details from repository...</p>
            </div>

            <!-- PROMINENT, LARGE AUTHOR SHOWCASE FOOTER -->
            <div id="article-author-section" class="border-t-2 border-blue-100 bg-gradient-to-br from-blue-50/70 to-slate-50/90 px-8 sm:px-12 py-8 flex flex-col items-center sm:items-start space-y-6 hidden">
                
                <div class="flex items-center space-x-2 border-l-4 border-[#172554] pl-3">
                    <span class="text-xs font-extrabold text-[#172554] uppercase tracking-widest font-['Raleway']">Written &amp; Published By</span>
                </div>

                <!-- High-Visibility Large Author Cards Container -->
                <div id="author-profiles-container" class="grid grid-cols-1 sm:grid-cols-2 gap-6 w-full">
                    <!-- Dynamically populated with large prominent cards -->
                </div>

            </div>
        </div>

        <div class="pt-4 text-center">
            <a href="articles.html" class="inline-flex items-center space-x-2 px-6 py-3 rounded-xl bg-[#172554] text-white font-bold text-xs uppercase tracking-wider hover:bg-blue-900 transition-all shadow-md">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Return to All Articles</span>
            </a>
        </div>

    </main>

    <footer class="bg-[#172554] text-gray-300 text-xs border-t border-blue-900 py-6 px-6 text-center mt-auto relative z-10">
        <p>&copy; 2026 Tawo E. Tawo SAN & Co. All Rights Reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        marked.setOptions({ html: true, gfm: true });

        async function loadSingleArticle() {
            const urlParams = new URLSearchParams(window.location.search);
            const fileNameParam = urlParams.get('file');

            if (!fileNameParam) {
                document.getElementById('article-body').innerHTML = '<p class="text-red-500 font-bold text-center py-8">Error: No article specified in request.</p>';
                return;
            }

            const fileName = decodeURIComponent(fileNameParam);
            const repoOwner = 'mordiifeanyi-git';
            const repoName = 'tawoetawosan-respo';
            const fileUrl = `https://raw.githubusercontent.com/${repoOwner}/${repoName}/main/articles/${encodeURIComponent(fileName)}`;

            try {
                const res = await fetch(fileUrl);
                if (!res.ok) throw new Error('Article file not found in repository.');

                const content = await res.text();

                let title = fileName.replace('.md', '');
                let date = '';
                let authorStr = '';
                let videoUrl = '';
                let imageUrl = '';
                let authorPhotoStr = '';

                const titleMatch = content.match(/^title:\s*["']?(.*?)["']?$/m);
                if (titleMatch && titleMatch[1]) title = titleMatch[1].trim();

                const dateMatch = content.match(/^date:\s*["']?(.*?)["']?$/m);
                if (dateMatch && dateMatch[1]) date = dateMatch[1].trim();

                const authorMatch = content.match(/^author:\s*["']?(.*?)["']?$/m);
                if (authorMatch && authorMatch[1] && authorMatch[1].trim() !== "") {
                    authorStr = authorMatch[1].trim();
                }

                const videoMatch = content.match(/^video:\s*["']?(.*?)["']?$/m);
                if (videoMatch && videoMatch[1] && videoMatch[1] !== "undefined") videoUrl = videoMatch[1].trim();

                const imageMatch = content.match(/^image:\s*["']?(.*?)["']?$/m);
                if (imageMatch && imageMatch[1] && imageMatch[1] !== "undefined") imageUrl = imageMatch[1].trim();

                const avatarMatch = content.match(/^author_photo:\s*["']?(.*?)["']?$/m);
                if (avatarMatch && avatarMatch[1] && avatarMatch[1] !== "undefined") authorPhotoStr = avatarMatch[1].trim();

                let cleanMarkdown = content.replace(/^---[\s\S]*?---/, '').trim();

                // Extract and format references / footnotes if present
                let referenceList = [];
                const refSplit = cleanMarkdown.split(/### References & Footnotes/i);
                if (refSplit.length > 1) {
                    cleanMarkdown = refSplit[0].trim();
                    referenceList = refSplit[1].trim().split('\n').map(l => l.replace(/^\d+\.\s*/, '').trim()).filter(Boolean);
                }

                document.getElementById('article-title').innerText = title;
                document.title = `${title} | TAWO E. TAWO, SAN & CO.`;
                document.getElementById('article-date').innerText = date ? new Date(date).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }).toUpperCase() : 'RECENT PUBLICATION';
                
                // Parse markdown and convert footnote markers (^1 -> superscript link)
                let parsedHtml = marked.parse(cleanMarkdown);
                parsedHtml = parsedHtml.replace(/\^(\d+)/g, '<sup><a href="#ref-$1" class="text-blue-600 font-bold hover:underline">[$1]</a></sup>');

                if (referenceList.length > 0) {
                    parsedHtml += `
                        <div class="article-footnote-list">
                            <h4>References &amp; Footnotes</h4>
                            <ol>`;
                    referenceList.forEach((refLine, idx) => {
                        parsedHtml += `<li id="ref-${idx+1}">${refLine}</li>`;
                    });
                    parsedHtml += `</ol></div>`;
                }

                document.getElementById('article-body').innerHTML = parsedHtml;

                // Build Prominent, Large Author Profiles Showcase
                let names = authorStr ? authorStr.split(',').map(s => s.trim()).filter(Boolean) : [];
                let photos = authorPhotoStr ? authorPhotoStr.split(',').map(s => s.trim()).filter(Boolean) : [];

                const authorSection = document.getElementById('article-author-section');
                const authorProfilesContainer = document.getElementById('author-profiles-container');
                authorProfilesContainer.innerHTML = '';

                if (names.length > 0 || photos.length > 0) {
                    authorSection.classList.remove('hidden');

                    const count = Math.max(names.length, photos.length);
                    for (let i = 0; i < count; i++) {
                        const name = names[i] || 'Tawo E. Tawo, SAN & Co.';
                        const photo = photos[i] || 'https://placehold.co/200x200/172554/FFFFFF?text=SAN';

                        authorProfilesContainer.innerHTML += `
                            <div class="bg-white/90 border border-blue-200/70 rounded-2xl p-4 sm:p-5 shadow-sm flex items-center space-x-4">
                                <div class="w-20 h-20 sm:w-24 sm:h-24 rounded-2xl border-2 border-white shadow-md overflow-hidden bg-slate-900 shrink-0">
                                    <img src="${photo}" class="w-full h-full object-cover" alt="${name}" onerror="this.onerror=null; this.src='https://placehold.co/200x200/172554/FFFFFF?text=SAN';">
                                </div>
                                <div class="space-y-1 min-w-0">
                                    <span class="text-[9px] uppercase tracking-widest text-blue-600 font-extrabold block">Legal Counsel</span>
                                    <h4 class="text-sm sm:text-base font-extrabold text-[#0F172A] font-['Raleway'] leading-snug truncate">${name}</h4>
                                    <span class="text-[10px] text-gray-500 block truncate">Tawo E. Tawo, SAN &amp; Co.</span>
                                </div>
                            </div>`;
                    }
                }

                const mediaContainer = document.getElementById('article-media-container');
                if (videoUrl) {
                    mediaContainer.classList.remove('hidden');
                    const ytMatch = videoUrl.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|v\/))([\w-]{11})/);
                    if (ytMatch && ytMatch[1]) {
                        mediaContainer.innerHTML = `
                            <iframe class="w-full h-full aspect-video" src="https://www.youtube.com/embed/${ytMatch[1]}?rel=0" title="Video" frameborder="0" allowfullscreen></iframe>`;
                    } else {
                        mediaContainer.innerHTML = `
                            <video controls class="w-full h-full object-contain">
                                <source src="${videoUrl}" type="video/mp4">
                            </video>`;
                    }
                } else if (imageUrl) {
                    mediaContainer.classList.remove('hidden');
                    mediaContainer.innerHTML = `<img src="${imageUrl}" class="w-full h-full object-cover">`;
                }

            } catch (err) {
                console.error(err);
                document.getElementById('article-body').innerHTML = '<p class="text-red-500 font-bold text-center py-8">Failed to load article content.</p>';
            }
        }

        document.addEventListener('DOMContentLoaded', loadSingleArticle);
    </script>
</body>
</html>
