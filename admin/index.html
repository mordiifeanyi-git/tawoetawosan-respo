<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard & Content Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Decap CMS Script -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col">

    <!-- PASSWORD LOGIN GATE -->
    <div id="login-gate" class="fixed inset-0 z-50 flex items-center justify-center bg-[#172554] px-4">
        <div class="bg-white rounded-3xl shadow-2xl border border-gray-100 max-w-md w-full p-8 text-center space-y-6">
            <div class="w-16 h-16 rounded-2xl bg-blue-50 border border-blue-100 text-[#172554] flex items-center justify-center mx-auto text-2xl shadow-inner">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <div>
                <h2 class="text-xl font-extrabold text-[#0F172A] font-['Raleway']">Firm Admin Login</h2>
                <p class="text-xs text-gray-500 mt-1">Enter authorized passkey to open the dashboard.</p>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <input type="password" id="admin-passkey" placeholder="Enter Firm Passcode" required class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-[#172554]">
                <button type="submit" class="w-full py-3 bg-[#172554] text-white rounded-xl font-semibold text-sm shadow-lg hover:bg-blue-900 transition-colors">Authorize Access</button>
            </form>
        </div>
    </div>

    <!-- MAIN DASHBOARD WRAPPER -->
    <div id="main-dashboard" class="hidden flex-1 flex flex-col">
        <!-- Top Navigation Bar -->
        <header class="bg-[#172554] text-white px-6 py-4 flex justify-between items-center shadow-md">
            <h1 class="font-bold text-lg font-['Raleway']">Tawo E. Tawo, SAN & Co. — Management Portal</h1>
            <div class="flex space-x-2 bg-blue-950 p-1 rounded-xl">
                <button onclick="switchTab('workbench')" id="btn-workbench" class="px-4 py-2 rounded-lg text-xs font-semibold bg-white text-[#172554] transition-all">Editor Workbench</button>
                <button onclick="switchTab('cms')" id="btn-cms" class="px-4 py-2 rounded-lg text-xs font-semibold text-white transition-all">Decap CMS</button>
            </div>
        </header>

        <!-- VIEW 1: WORKBENCH -->
        <main id="view-workbench" class="flex-1 p-6 max-w-4xl mx-auto w-full">
            <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 space-y-4">
                <h2 class="text-lg font-bold text-gray-800">Article Generator Workbench</h2>
                <p class="text-xs text-gray-500">Fill in the fields below to create and download structured article files for the firm website.</p>
                <!-- Workbench fields can go here -->
            </div>
        </main>

        <!-- VIEW 2: DECAP CMS (Safe Container) -->
        <main id="view-cms" class="hidden flex-1 w-full bg-slate-100 relative">
            <div id="nc-root" class="w-full h-full min-h-[80vh]"></div>
        </main>
    </div>

    <script>
        let cmsInitialized = false;

        function handleLogin(e) {
            e.preventDefault();
            const passkey = document.getElementById('admin-passkey').value;
            if (passkey === 'TAWO2026') {
                document.getElementById('login-gate').classList.add('hidden');
                document.getElementById('main-dashboard').classList.remove('hidden');
            } else {
                alert('Invalid passkey.');
            }
        }

        function switchTab(tab) {
            const btnW = document.getElementById('btn-workbench');
            const btnC = document.getElementById('btn-cms');
            const viewW = document.getElementById('view-workbench');
            const viewC = document.getElementById('view-cms');

            if (tab === 'workbench') {
                btnW.className = "px-4 py-2 rounded-lg text-xs font-semibold bg-white text-[#172554] transition-all";
                btnC.className = "px-4 py-2 rounded-lg text-xs font-semibold text-white transition-all";
                viewW.classList.remove('hidden');
                viewC.classList.add('hidden');
            } else {
                btnC.className = "px-4 py-2 rounded-lg text-xs font-semibold bg-white text-[#172554] transition-all";
                btnW.className = "px-4 py-2 rounded-lg text-xs font-semibold text-white transition-all";
                viewC.classList.remove('hidden');
                viewW.classList.add('hidden');

                // Initialize Decap CMS safely the moment the tab is clicked
                if (!cmsInitialized) {
                    CMS.init();
                    cmsInitialized = true;
                }
            }
        }
    </script>
</body>
</html>
